<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Family Week · The Family</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Crect x='12' y='16' width='40' height='36' rx='6' fill='none' stroke='%235eead4' stroke-width='4'/%3E%3Cpath d='M12 26h40' stroke='%235eead4' stroke-width='4'/%3E%3Ccircle cx='24' cy='37' r='4' fill='%23f472b6'/%3E%3Ccircle cx='40' cy='37' r='4' fill='%23fbbf24'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="sky"></canvas>
<div id="stage">
  <header id="top">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="40" rx="8" fill="none" stroke="currentColor" stroke-width="4"/><path d="M10 25h44" stroke="currentColor" stroke-width="4"/><path d="M22 9v10M42 9v10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="23" cy="38" r="4.5" fill="#f472b6"/><circle cx="41" cy="38" r="4.5" fill="var(--amber)"/></svg></div>
      <div><div class="brand-name">FAMILY WEEK</div><div class="brand-sub mono">THE FAMILY · HOMETOWN, MD</div></div>
    </div>
    <div class="clock">
      <div class="time"><span id="clkHM">--:--</span><span id="clkAP" class="ap">--</span></div>
      <div id="clkDate" class="date">—</div>
    </div>
    <div id="pulse" class="pulse"></div>
    <div class="ctrl">
      <div id="viewToggle" class="seg"><button data-v="7">7 DAYS</button><button data-v="14">14 DAYS</button><button data-v="tl">TIMELINE</button></div>
      <div id="chips" class="chips"></div>
    </div>
  </header>

  <main id="main">
    <section id="boardWrap" class="panel">
      <div id="board" class="board"></div>
    </section>
    <aside id="side">
      <section id="tonight" class="panel tonight"></section>
      <section id="conflicts" class="panel"></section>
      <section id="games" class="panel"></section>
    </aside>
  </main>

  <footer id="legend"></footer>

  <div id="ambient">
    <div class="amb-in">
      <div id="ambClock" class="amb-clock">--:--</div>
      <div id="ambDate" class="amb-date">—</div>
      <div id="ambNext" class="amb-next"></div>
      <div id="ambSub" class="amb-sub"></div>
    </div>
  </div>
  <div id="hint" class="hint mono">W · 7/14 days &nbsp; T · timeline &nbsp; A · ambient &nbsp; F · fullscreen &nbsp; R · reload data</div>
</div>
<script src="app.js"></script>
</body>
</html>
